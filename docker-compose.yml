services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dj_ai-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      DB_PATH: /app/data/app.db
      AUDIO_DIR: /app/data/audio
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dj-audio
      MINIO_SECURE: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    user: "1000:1000"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
    container_name: dj_ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: dj_ai-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: dj_ai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb -p local/dj-audio || true &&
      /usr/bin/mc anonymous set private local/dj-audio || true
      "
    restart: "no"

volumes:
  minio_data: